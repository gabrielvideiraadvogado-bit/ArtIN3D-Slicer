<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashforge</title>
<style>
  /* ArtIN3D colours, from the logo: orange, blue and graphite. */
  :root {
    --orange: #f07a22; --orange-dark: #d8641a; --blue: #3b8fd6; --graphite: #1e2024;
    --bg: #f2f3f5; --card: #ffffff; --text: #1b1c1f; --muted: #6b7079; --line: #e3e5ea; --soft: #f6f7f9;
    --ok: #2e9e5b; --warn: #e0912f; --err: #d64545;
    --flange: #e4e7ec; --flange-line: #b6bcc6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141518; --card: #1f2125; --text: #eef0f3; --muted: #9aa0aa; --line: #30333a; --soft: #26292e;
            --flange: #3a3e45; --flange-line: #5d636c; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px;
           background: var(--graphite); color: #f2f3f5; border-bottom: 3px solid var(--orange); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 36px; height: 36px; flex: none; }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  .brand h1 .art { color: var(--orange); } .brand h1 .in3d { color: #f2f3f5; } .brand h1 small { color: #9aa0aa; font-weight: 500; margin-left: 6px; font-size: 13px; }
  .brand .sub { font-size: 12px; color: #b9bec7; }
  header .side { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  header .who { text-align: right; font-size: 12px; color: #c9cdd4; }
  .muted { color: var(--muted); }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
           padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover:not(:disabled) { border-color: var(--orange); }
  button.primary { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--orange-dark); border-color: var(--orange-dark); }
  header button { background: transparent; color: #f2f3f5; border-color: #4a4e56; }
  header button.primary { background: var(--orange); border-color: var(--orange); }
  button:disabled { opacity: .45; cursor: default; }
  button svg { width: 16px; height: 16px; }
  main { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 18px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; padding: 12px; } }
  .empty { grid-column: 1 / -1; text-align: center; padding: 70px 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { .card-grid { grid-template-columns: 1fr; } }
  .camera { position: relative; background: #0d0e10; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; }
  .camera video, .camera img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .camera .wait, .cam-ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                           gap: 8px; color: #8d939c; font-size: 12px; text-align: center; padding: 16px; }
  .cam-ph svg { width: 40px; height: 40px; opacity: .6; }
  .cam-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .cam-bar button { flex: 1; justify-content: center; }
  button.on { background: rgba(240,122,34,.12); border-color: var(--orange); color: var(--orange); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .head h2 { font-size: 17px; margin: 0; }
  .status { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; background: var(--muted); white-space: nowrap; }
  .status.ready, .status.completed { background: var(--ok); } .status.printing { background: var(--blue); } .status.error { background: var(--err); }
  .status.busy, .status.heating, .status.pause, .status.pausing, .status.calibrate_doing { background: var(--warn); }
  .temps { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin-top: 14px; }
  .tile { background: var(--soft); border-radius: 10px; padding: 9px 11px; }
  .tile span { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .tile span svg { width: 13px; height: 13px; }
  .tile b { display: block; font-size: 17px; margin-top: 3px; }
  .job { margin-top: 14px; background: var(--soft); border-radius: 10px; padding: 11px 12px; }
  .job .file { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .pct { font-size: 22px; font-weight: 700; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--orange), var(--blue)); }
  .ifs { border-top: 1px solid var(--line); padding: 14px 16px 16px; }
  .ifs h3 { font-size: 13px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .spools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .spool-tile { position: relative; background: var(--soft); border: 2px solid transparent; border-radius: 12px; padding: 10px 8px; text-align: center; }
  .spool-tile.loaded { border-color: var(--orange); }
  .spool-tile .no { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--graphite);
                    color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .spool-tile .badge { position: absolute; top: 8px; right: 8px; background: var(--orange); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
  .spool { width: 92px; height: 100px; display: block; margin: 6px auto 4px; }
  .spool .flange { fill: var(--flange); stroke: var(--flange-line); stroke-width: 2; }
  .spool .hole { fill: var(--flange-line); }
  .spool-tile.vacant .spool .flange { fill: none; stroke-dasharray: 5 4; }
  .spool-tile .mat { font-weight: 600; font-size: 13px; }
  .spool-tile .hex { font-size: 11px; color: var(--muted); }
  .spool-tile button { margin-top: 8px; width: 100%; justify-content: center; padding: 5px 6px; font-size: 12px; }
  .spool-tile button.load { border-color: var(--orange); color: var(--orange); }
  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--soft); }
  .card-foot .msg { font-size: 12px; color: var(--muted); }
  .error-box { grid-column: 1 / -1; background: #fdecec; color: #8a1f1f; border-radius: 8px; padding: 10px 14px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .dialog { background: var(--card); border-radius: 14px; padding: 20px; width: min(540px, 92vw); max-height: 90vh; overflow: auto; border-top: 4px solid var(--orange); }
  .dialog h3 { margin: 0 0 4px; font-size: 16px; }
  .dialog select { font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .maprow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .maprow .dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  .maprow select { flex: 1; }
  .opts label { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .opts input { accent-color: var(--orange); }
  .live { font-size: 12px; } .live.on::before { content: '●'; color: #4cd07d; margin-right: 4px; } .live.off::before { content: '●'; color: #7d828b; margin-right: 4px; }
</style>
<script src="lib/flv.min.js"></script>
<script src="lib/hls.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="spool-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </linearGradient>
  </defs>
</svg>
<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="20,3 36,12 20,21 4,12" fill="#f07a22"/>
      <polygon points="4,12 20,21 20,38 4,29" fill="#d8641a"/>
      <polygon points="36,12 20,21 20,38 36,29" fill="#3b8fd6"/>
      <polyline points="10,15 16,18.5 16,26" fill="none" stroke="#1e2024" stroke-width="2"/>
      <polyline points="30,15 24,18.5 24,26" fill="none" stroke="#1e2024" stroke-width="2"/>
    </svg>
    <div>
      <h1><span class="art">Art</span><span class="in3d">IN3D</span><small>Impressoras Flashforge</small></h1>
      <div id="live" class="live off sub" hidden>Tempo real desligado</div>
    </div>
  </div>
  <div class="side">
    <div id="account" class="who">Carregando…</div>
    <button id="refresh" hidden>Atualizar</button>
    <button id="login" class="primary" hidden>Entrar com a conta Flashforge</button>
    <button id="logout" hidden>Sair</button>
  </div>
</header>
<main id="printers"></main>
<script>
(function () {
  const STATUS = {
    ready: 'Pronta', busy: 'Ocupada', calibrate_doing: 'Calibrando', error: 'Erro', heating: 'Aquecendo',
    printing: 'Imprimindo', pausing: 'Pausando', pause: 'Pausada', canceling: 'Cancelando', cancel: 'Cancelada',
    completed: 'Concluída', offline: 'Desconectada'
  };
  const $ = (id) => document.getElementById(id);
  const post = (command, data) => window.wx && window.wx.postMessage(JSON.stringify({ command, data: data || {} }));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const temp = (now, target) => `${Math.round(now || 0)}°${target ? ` / ${Math.round(target)}°` : ''}`;
  const color = (c) => /^#?[0-9a-fA-F]{6}$/.test(c || '') ? (c[0] === '#' ? c : '#' + c) : 'transparent';
  const duration = (s) => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };

  let account = { loggedIn: false };
  let printers = [];          // last list, with the newest detail merged in
  const cameras = {};         // devId -> { open, url, player }
  const busy = {};            // devId -> action waiting for the printer

  function renderAccount() {
    $('login').hidden = !account.available || account.loggedIn;
    $('logout').hidden = !account.loggedIn;
    $('refresh').hidden = !account.loggedIn;
    if (!account.available) {
      $('account').textContent = 'Indisponível neste Mac: ' + (account.reason === 'Flash Studio is not installed'
        ? 'instale o Flash Studio (ele fornece a conexão da Flashforge).' : account.reason);
      $('printers').innerHTML = '';
    } else if (!account.loggedIn) {
      $('account').textContent = 'Entre com a sua conta Flashforge (e-mail, Apple, Google ou Facebook).';
      $('printers').innerHTML = '<div class="empty muted">Depois de entrar, as impressoras da sua conta aparecem aqui, de qualquer lugar.</div>';
    } else {
      const p = account.profile || {};
      $('account').textContent = 'Conta: ' + (p.nickname || p.email || 'conectada');
    }
  }

  const ICON = {
    nozzle: '<svg viewBox="0 0 16 16"><path d="M5 1h6v4H5zM4 5h8l-2 5H6zM7 10h2l-1 4z" fill="currentColor"/></svg>',
    bed: '<svg viewBox="0 0 16 16"><rect x="1" y="9" width="14" height="3" rx="1" fill="currentColor"/><path d="M4 7c0-2 2-2 2-4M8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>',
    chamber: '<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M5 11h6" stroke="currentColor" stroke-width="1.5"/></svg>',
    bulb: '<svg viewBox="0 0 16 16"><path d="M8 1a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9zM6 13h4v2H6z" fill="currentColor"/></svg>',
    cam: '<svg viewBox="0 0 24 24"><path d="M4 7h11v10H4zM15 10l5-3v10l-5-3z" fill="currentColor"/></svg>',
    send: '<svg viewBox="0 0 16 16"><path d="M8 1l5 5h-3v5H6V6H3zM2 13h12v2H2z" fill="currentColor"/></svg>'
  };
  const IDLE = ['ready', 'completed', 'cancel'];

  // A spool seen from the side, as in Flash Studio: the filament wound between two flanges.
  function spool(s) {
    const c = s.hasFilament ? color(s.color) : null;
    const winds = c ? [20, 28, 36, 44, 52, 60, 68, 76, 84, 92].map((y) => `<line x1="26" x2="74" y1="${y}" y2="${y}" stroke="rgba(0,0,0,.10)"/>`).join('') : '';
    const body = c ? `<rect x="26" y="12" width="48" height="86" fill="${c}" stroke="rgba(0,0,0,.18)"/>` +
      `<rect x="26" y="12" width="48" height="86" fill="url(#spool-shade)"/>${winds}` : '';
    return `<svg class="spool" viewBox="0 0 100 110" aria-hidden="true">` +
      `<ellipse class="flange" cx="74" cy="55" rx="15" ry="51"/>${body}` +
      `<ellipse class="flange" cx="26" cy="55" rx="15" ry="51"/><ellipse class="hole" cx="26" cy="55" rx="4.5" ry="14"/></svg>`;
  }

  function info(printer) {
    const d = printer.detail || {};
    const status = d.status || printer.status || 'offline';
    let html = `<div class="head"><div><h2>${esc(printer.name)}</h2><div class="muted">${esc(printer.model)}</div></div>` +
      `<span class="status ${esc(status)}">${esc(STATUS[status] || status)}</span></div>`;
    if (printer.detailError && !printer.detail) {
      return html + `<div class="muted" style="margin-top:12px">Sem detalhes agora: ${esc(printer.detailError)}</div>`;
    }
    html += '<div class="temps">' +
      `<div class="tile"><span>${ICON.nozzle}Bico</span><b>${temp(d.nozzleTemp, d.nozzleTargetTemp)}</b></div>` +
      `<div class="tile"><span>${ICON.bed}Mesa</span><b>${temp(d.bedTemp, d.bedTargetTemp)}</b></div>` +
      (d.chamberTemp ? `<div class="tile"><span>${ICON.chamber}Câmara</span><b>${temp(d.chamberTemp)}</b></div>` : '') +
      '</div>';
    if (d.printFileName && ['printing', 'pausing', 'pause', 'heating', 'busy'].includes(status)) {
      const pct = Math.round((d.printProgress || 0) * 100);
      const left = d.estimatedTime ? `faltam ${duration(d.estimatedTime)}` : '';
      html += `<div class="job"><div class="file">${esc(d.printFileName)}</div>` +
        `<div class="pct">${pct}%</div><div class="progress"><div style="width:${pct}%"></div></div>` +
        `<span class="muted">camada ${d.printLayer || 0} de ${d.targetPrintLayer || 0}${left ? ' · ' + left : ''}</span></div>`;
    } else if (IDLE.includes(status)) {
      html += '<div class="job muted">Pronta para imprimir. Use <b>Imprimir</b> no fatiador ou <b>Enviar arquivo</b> abaixo.</div>';
    }
    return html;
  }

  function ifs(printer) {
    const d = printer.detail || {};
    const slots = (d.matlStation && d.matlStation.slots) || [];
    if (!slots.length) return '';
    const status = d.status || printer.status || 'offline';
    const can = IDLE.includes(status) && !busy[printer.devId];
    const dev = esc(printer.devId);
    const loaded = d.matlStation.currentLoadSlot;
    return '<h3>Estação de filamentos (IFS)' +
      (can ? '' : '<span class="muted" style="font-weight:400">carregar e descarregar só com a impressora parada</span>') + '</h3>' +
      '<div class="spools">' + slots.map((s) => {
        const isLoaded = s.slotId === loaded;
        const btn = !s.hasFilament ? '' : isLoaded
          ? `<button data-act="unloadFilament" data-dev="${dev}" data-slot="${s.slotId}" ${can ? '' : 'disabled'}>Descarregar</button>`
          : `<button class="load" data-act="loadFilament" data-dev="${dev}" data-slot="${s.slotId}" ${can ? '' : 'disabled'}>Carregar</button>`;
        return `<div class="spool-tile${isLoaded ? ' loaded' : ''}${s.hasFilament ? '' : ' vacant'}">` +
          `<div class="no">${esc(s.slotId)}</div>${isLoaded ? '<div class="badge">No bico</div>' : ''}${spool(s)}` +
          `<div class="mat">${s.hasFilament ? esc(s.material || '?') : 'Vazia'}</div>` +
          `<div class="hex">${s.hasFilament ? esc(color(s.color).toUpperCase()) : '&nbsp;'}</div>${btn}</div>`;
      }).join('') + '</div>';
  }

  function cameraPlaceholder(printer) {
    const none = printer.detail && printer.detail.camera === 2;
    return `<div class="cam-ph">${ICON.cam}<span>${none ? 'Esta impressora não tem câmera.' : 'Câmera desligada'}</span></div>`;
  }

  function lightButton(dev, on) {
    return `<button data-act="light" data-dev="${esc(dev)}" data-on="${on ? 0 : 1}" id="light-${esc(dev)}" class="${on ? 'on' : ''}">` +
      `${ICON.bulb}${on ? 'Luz acesa' : 'Luz apagada'}</button>`;
  }

  function card(printer) {
    const dev = esc(printer.devId);
    const d = printer.detail || {};
    return `<div class="card" id="card-${dev}"><div class="card-grid">` +
      `<div><div class="camera" id="cam-${dev}">${cameraPlaceholder(printer)}</div><div class="cam-bar">` +
      (d.camera === 2 ? '' : `<button data-act="camera" data-dev="${dev}" id="cambtn-${dev}">${ICON.cam}Ver câmera</button>`) +
      `<span id="lightwrap-${dev}">${lightButton(printer.devId, d.lightStatus === 'open')}</span></div></div>` +
      `<div id="info-${dev}">${info(printer)}</div></div>` +
      `<div class="ifs" id="ifs-${dev}">${ifs(printer)}</div>` +
      `<div class="card-foot"><span class="msg" id="msg-${dev}"></span>` +
      `<button class="primary" data-act="pickFile" data-dev="${dev}">${ICON.send}Enviar arquivo…</button></div></div>`;
  }

  function updateCard(printer) {
    const dev = printer.devId;
    const infoEl = document.getElementById('info-' + dev);
    if (!infoEl) return renderPrinters();
    infoEl.innerHTML = info(printer);
    const ifsEl = document.getElementById('ifs-' + dev);
    if (ifsEl) ifsEl.innerHTML = ifs(printer);
    const d = printer.detail || {};
    const wrap = document.getElementById('lightwrap-' + dev);
    if (wrap && !busy[dev]) wrap.innerHTML = lightButton(dev, d.lightStatus === 'open');
    const cam = cameras[dev];
    if (cam && cam.open && d.cameraStreamUrl && d.cameraStreamUrl !== cam.url) startCamera(dev, d.cameraStreamUrl);
  }

  function renderPrinters(error) {
    let html = error ? `<div class="error-box">Não foi possível atualizar: ${esc(error)}</div>` : '';
    html += printers.length ? printers.map(card).join('')
      : (error ? '' : '<div class="empty muted">Nenhuma impressora vinculada a esta conta.</div>');
    $('printers').innerHTML = html;
    for (const dev of Object.keys(cameras)) if (cameras[dev].open) {
      const url = cameras[dev].url; cameras[dev].url = null;
      if (url) startCamera(dev, url);
    }
  }

  function stopCamera(dev) {
    const cam = cameras[dev];
    if (cam) { clearTimeout(cam.retry); clearInterval(cam.watch); }
    if (cam && cam.player) { try { cam.player.destroy(); } catch (e) {} }
    delete cameras[dev];
    const box = document.getElementById('cam-' + dev);
    const printer = printers.find((p) => p.devId === dev) || {};
    if (box) box.innerHTML = cameraPlaceholder(printer);
    const btn = document.getElementById('cambtn-' + dev);
    if (btn) { btn.innerHTML = ICON.cam + 'Ver câmera'; btn.classList.remove('on'); }
  }

  function startCamera(dev, url) {
    const cam = cameras[dev];
    if (!cam) return;
    cam.url = url; cam.tries = 0;
    playCamera(dev);
  }

  // The cloud stream only exists a few seconds after the "open" command reaches the
  // printer, so failed or stalled attempts are retried. Cloud HLS URLs also serve FLV at
  // the same path. The app's WebKit view plays HLS natively but not flv.js (its media
  // source stalls without an error), so native HLS goes first where the engine has it.
  function playCamera(dev) {
    const box = document.getElementById('cam-' + dev);
    const cam = cameras[dev];
    if (!box || !cam || !cam.url) return;
    if (cam.player) { try { cam.player.destroy(); } catch (e) {} cam.player = null; }
    clearTimeout(cam.retry); clearInterval(cam.watch);
        const url = cam.url, hls = /\.m3u8(\?|$|\/|#)/i.test(url);
    const nativeHls = !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');
    const flvSource = { type: 'flv', url: url.replace(/\.m3u8/i, '.flv') }, hlsSource = { type: 'hls', url };
    const sources = hls ? (nativeHls ? [hlsSource, flvSource] : [flvSource, hlsSource])
      : /\.flv(\?|$|\/|#)/i.test(url) ? [{ type: 'flv', url }] : [{ type: 'img', url }];
    const src = sources[cam.tries % sources.length];
    const failed = () => {
      if (cameras[dev] !== cam || cam.url !== url) return;
      clearInterval(cam.watch);
      if (cam.player) { try { cam.player.destroy(); } catch (e) {} cam.player = null; }
      if (++cam.tries > 20) { box.innerHTML = '<div class="wait">Não foi possível abrir o vídeo da câmera.</div>'; return; }
      box.innerHTML = '<div class="wait">Aguardando o vídeo da impressora…</div>';
      cam.retry = setTimeout(() => playCamera(dev), 3000);
    };
    if (src.type === 'img') { box.innerHTML = `<img alt="Câmera" src="${esc(src.url)}">`; return; }
    box.innerHTML = '<video muted autoplay playsinline></video>';
    const video = box.firstChild;
    // A player that shows nothing for 15 s counts as failed; once playing, 20 s frozen does.
    let last = -1, still = 0;
    cam.watch = setInterval(() => {
      if (video.currentTime !== last) { last = video.currentTime; still = 0; return; }
      still += 5;
      if (still >= (last > 0 ? 20 : 15)) failed();
    }, 5000);
    if (src.type === 'hls' && nativeHls) {
      video.onerror = failed; video.src = src.url;
      const p = video.play(); if (p && p.catch) p.catch(() => {});
    } else if (src.type === 'flv' && window.flvjs && flvjs.isSupported()) {
      cam.player = flvjs.createPlayer({ type: 'flv', isLive: true, url: src.url }, { enableStashBuffer: false });
      cam.player.on(flvjs.Events.ERROR, failed);
      cam.player.attachMediaElement(video); cam.player.load();
      const p = cam.player.play(); if (p && p.catch) p.catch(() => {});
    } else if (src.type === 'hls' && window.Hls && Hls.isSupported()) {
      cam.player = new Hls({ lowLatencyMode: true });
      cam.player.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) failed(); });
      cam.player.loadSource(src.url); cam.player.attachMedia(video);
    } else if (src.type === 'hls' && video.canPlayType('application/vnd.apple.mpegurl')) {
      video.onerror = failed; video.src = src.url;
    } else {
      failed();
    }
  }

  document.addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-act]');
    if (!b) return;
    const dev = b.dataset.dev, act = b.dataset.act;
    const printer = printers.find((p) => p.devId === dev) || {};
    if (act === 'camera') {
      if (cameras[dev]) { stopCamera(dev); post('camera', { devId: dev, open: false }); return; }
      cameras[dev] = { open: true, url: null, player: null };
      b.innerHTML = ICON.cam + 'Fechar câmera'; b.classList.add('on');
      document.getElementById('cam-' + dev).innerHTML = '<div class="wait">Abrindo a câmera…</div>';
      post('camera', { devId: dev, open: true });
      const url = printer.detail && printer.detail.cameraStreamUrl;
      if (url) startCamera(dev, url);
      return;
    }
    if (act === 'pickFile') { post('pickFile', { devId: dev }); return; }
    if (act === 'loadFilament' || act === 'unloadFilament') {
      const verb = act === 'loadFilament' ? 'carregar o filamento da posição' : 'descarregar o filamento da posição';
      if (!(await confirmBox(`Confirma ${verb} ${b.dataset.slot} na ${printer.name || 'impressora'}? A impressora vai aquecer o bico.`))) return;
      busy[dev] = act; b.disabled = true;
      post(act, { devId: dev, slot: Number(b.dataset.slot) });
    } else if (act === 'light') {
      busy[dev] = act; b.disabled = true;
      post('light', { devId: dev, on: b.dataset.on === '1' });
    }
    const msg = document.getElementById('msg-' + dev);
    if (msg) msg.textContent = 'Enviando comando…';
  });

  // Confirmations are drawn on the page: not every embedded web view implements window.confirm.
  function confirmBox(text) {
    return new Promise((resolve) => {
      const o = document.createElement('div');
      o.className = 'overlay';
      o.style.zIndex = 10;
      o.innerHTML = `<div class="dialog"><div>${esc(text)}</div><div class="actions" style="justify-content:flex-end">` +
        `<button data-r="0">Cancelar</button><button class="primary" data-r="1">Confirmar</button></div></div>`;
      o.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-r]');
        if (!b) return;
        o.remove();
        resolve(b.dataset.r === '1');
      });
      document.body.appendChild(o);
    });
  }

  function closeDialog() { const o = document.getElementById('send-dialog'); if (o) o.remove(); }

  function showSendDialog(setup) {
    closeDialog();
    const p = printers.find((x) => x.devId === setup.devId) || {};
    const slots = ((p.detail && p.detail.matlStation && p.detail.matlStation.slots) || []).filter((s) => s.hasFilament);
    const norm = (c) => String(c || '').replace('#', '').toUpperCase();
    // Preselect the slot with the same colour, otherwise the same position.
    const guess = (t, i) => (slots.find((s) => norm(s.color) === norm(t.color)) || slots[i] || slots[0] || {}).slotId;
    const rows = setup.tools.map((t, i) => `<div class="maprow"><span class="dot" style="background:${color(t.color)}"></span>` +
      `<span style="min-width:110px">Cor ${t.toolId + 1}: ${esc(t.type)}</span>` +
      `<select data-tool="${t.toolId}" data-color="${esc(t.color)}">` +
      slots.map((s) => `<option value="${s.slotId}" ${s.slotId === guess(t, i) ? 'selected' : ''}>Posição ${s.slotId}: ${esc(s.material)} ${esc(s.color)}</option>`).join('') +
      `</select></div>`).join('');
    const box = document.createElement('div');
    box.className = 'overlay'; box.id = 'send-dialog';
    // Sent from the slicer's Print button, the file may go to any printer of the account.
    const choices = setup.choices || [];
    const picker = choices.length > 1 ? `<div style="margin-top:8px"><select id="send-printer">` +
      choices.map((c) => `<option value="${esc(c.devId)}" ${c.devId === setup.devId ? 'selected' : ''}>${esc(c.name || c.devId)}</option>`).join('') +
      `</select></div>` : '';
    box.innerHTML = `<div class="dialog"><h3>Enviar para ${esc(p.name || 'a impressora')}</h3><div class="muted">${esc(setup.fileName)}</div>` + picker +
      (slots.length ? `<div style="margin-top:12px"><b>Cores → posições do IFS</b>${rows}</div>`
                    : '<div class="muted" style="margin-top:12px">Sem posições carregadas no IFS: o arquivo vai sem mapa de cores.</div>') +
      `<div class="opts" style="margin-top:14px"><label><input type="checkbox" id="opt-print" checked> Iniciar a impressão assim que chegar</label>` +
      `<label><input type="checkbox" id="opt-level"> Nivelar a mesa antes</label>` +
      `<label><input type="checkbox" id="opt-tl"> Gravar timelapse</label></div>` +
      `<div id="send-progress" class="muted" style="margin-top:12px"></div>` +
      `<div class="actions" style="justify-content:flex-end"><button id="send-cancel">Cancelar</button><button class="primary" id="send-go">Enviar</button></div></div>`;
    document.body.appendChild(box);
    document.getElementById('send-cancel').onclick = closeDialog;
    const pick = document.getElementById('send-printer');
    if (pick) pick.onchange = () => showSendDialog(Object.assign({}, setup, { devId: pick.value }));
    document.getElementById('send-go').onclick = async () => {
      const mappings = [...box.querySelectorAll('select[data-tool]')].map((sel) => {
        const slot = slots.find((s) => s.slotId === Number(sel.value)) || {};
        return { toolId: Number(sel.dataset.tool), slotId: Number(sel.value), materialName: slot.material || '',
                 toolColor: sel.dataset.color, slotColor: slot.color || '' };
      });
      const printNow = document.getElementById('opt-print').checked;
      if (printNow && !(await confirmBox('A impressora vai começar a imprimir assim que o arquivo chegar. A mesa está livre?'))) return;
      document.getElementById('send-go').disabled = true;
      document.getElementById('send-cancel').disabled = true;
      document.getElementById('send-progress').textContent = 'Enviando… 0%';
      post('sendFile', { devId: setup.devId, mappings, printNow,
                         leveling: document.getElementById('opt-level').checked,
                         timeLapse: document.getElementById('opt-tl').checked });
    };
  }

  window.artin3dFlashforge = {
    receive(message) {
      if (message.type === 'account') {
        account = message.data;
        renderAccount();
      } else if (message.type === 'loading') {
        $('refresh').disabled = true;
      } else if (message.type === 'printers') {
        $('refresh').disabled = false;
        if (!account.loggedIn) return;
        const error = message.data.error;
        if (!error || message.data.printers.length) printers = message.data.printers;
        renderPrinters(error);
      } else if (message.type === 'detail') {
        const p = printers.find((x) => x.devId === message.data.devId);
        if (p) { p.detail = message.data; p.status = message.data.status; updateCard(p); }
      } else if (message.type === 'offline' || message.type === 'online') {
        const p = printers.find((x) => x.devId === message.data.devId);
        if (p && message.type === 'offline') { p.detail = Object.assign({}, p.detail, { status: 'offline' }); updateCard(p); }
      } else if (message.type === 'connection') {
        $('live').hidden = !account.loggedIn;
        $('live').className = 'live sub ' + (message.data.connected ? 'on' : 'off');
        $('live').textContent = message.data.connected ? 'Tempo real ligado' : 'Tempo real desligado' + (message.data.error ? ': ' + message.data.error : '');
      } else if (message.type === 'sendSetup') {
        showSendDialog(message.data);
      } else if (message.type === 'sendProgress') {
        const el = document.getElementById('send-progress');
        if (el) el.textContent = `Enviando… ${Math.round(message.data.progress * 100)}%`;
      } else if (message.type === 'sendResult') {
        const el = document.getElementById('send-progress');
        if (message.data.error) {
          if (el) { el.textContent = 'Falhou: ' + message.data.error; document.getElementById('send-cancel').disabled = false; }
          else { const m = document.getElementById('msg-' + message.data.devId); if (m) m.textContent = 'Falhou: ' + message.data.error; }
        } else {
          closeDialog();
          const m = document.getElementById('msg-' + message.data.devId);
          if (m) m.textContent = 'Arquivo enviado.';
        }
      } else if (message.type === 'commandResult') {
        const dev = message.data.devId;
        delete busy[dev];
        const msg = document.getElementById('msg-' + dev);
        if (msg) msg.textContent = message.data.error ? 'Falhou: ' + message.data.error : 'Comando enviado.';
        const p = printers.find((x) => x.devId === dev);
        if (p) updateCard(p);
        const light = document.getElementById('light-' + dev);
        if (light) light.disabled = false;
      }
    }
  };

  $('login').onclick = () => post('login');
  $('logout').onclick = () => post('logout');
  $('refresh').onclick = () => post('refresh');
  post('ready');
})();
</script>
</body>
</html>
