<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashforge</title>
<style>
  :root {
    --bg: #f6f6f8; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e2e7;
    --accent: #f07a1e; --accent2: #3b8fd0; --ok: #2e9e5b; --warn: #d9822b; --err: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1f22; --card: #2b2b2f; --text: #f2f2f5; --muted: #a1a1a8; --line: #3a3a40; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .status { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; color: #fff; background: var(--muted); }
  .status.ready { background: var(--ok); } .status.printing { background: var(--accent2); } .status.error { background: var(--err); }
  .status.busy, .status.heating, .status.pause, .status.pausing { background: var(--warn); }
  .row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .metric { min-width: 90px; } .metric b { display: block; font-size: 16px; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: var(--accent2); }
  .slots { display: flex; gap: 10px; margin-top: 12px; }
  .slot { flex: 1; text-align: center; font-size: 12px; }
  .swatch { width: 100%; height: 28px; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 4px; }
  .swatch.emptyslot { background: repeating-linear-gradient(45deg, transparent, transparent 4px, var(--line) 4px, var(--line) 8px); }
  .error-box { grid-column: 1 / -1; background: #fdecec; color: #8a1f1f; border-radius: 8px; padding: 10px 14px; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Impressoras Flashforge</h1>
    <div id="account" class="muted">Carregando…</div>
  </div>
  <div>
    <button id="refresh" hidden>Atualizar</button>
    <button id="login" class="primary" hidden>Entrar com a conta Flashforge</button>
    <button id="logout" hidden>Sair</button>
  </div>
</header>
<main id="printers"></main>
<script>
(function () {
  const STATUS = {
    ready: 'Pronta', busy: 'Ocupada', calibrate_doing: 'Calibrando', error: 'Erro', heating: 'Aquecendo',
    printing: 'Imprimindo', pausing: 'Pausando', pause: 'Pausada', canceling: 'Cancelando', cancel: 'Cancelada',
    completed: 'Concluída', offline: 'Desconectada'
  };
  const $ = (id) => document.getElementById(id);
  const post = (command, data) => window.wx && window.wx.postMessage(JSON.stringify({ command, data: data || {} }));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const temp = (now, target) => `${Math.round(now || 0)}°${target ? ` / ${Math.round(target)}°` : ''}`;
  const color = (c) => /^#?[0-9a-fA-F]{6}$/.test(c || '') ? (c[0] === '#' ? c : '#' + c) : 'transparent';
  const duration = (s) => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };

  let account = { loggedIn: false };

  function renderAccount() {
    $('login').hidden = !account.available || account.loggedIn;
    $('logout').hidden = !account.loggedIn;
    $('refresh').hidden = !account.loggedIn;
    if (!account.available) {
      $('account').textContent = 'Indisponível neste Mac: ' + (account.reason === 'Flash Studio is not installed'
        ? 'instale o Flash Studio (ele fornece a conexão da Flashforge).' : account.reason);
      $('printers').innerHTML = '';
    } else if (!account.loggedIn) {
      $('account').textContent = 'Entre com a sua conta Flashforge (e-mail, Apple, Google ou Facebook).';
      $('printers').innerHTML = '<div class="empty muted">Depois de entrar, as impressoras da sua conta aparecem aqui, de qualquer lugar.</div>';
    } else {
      const p = account.profile || {};
      $('account').textContent = 'Conta: ' + (p.nickname || p.email || 'conectada');
    }
  }

  function card(printer) {
    const d = printer.detail || {};
    const status = d.status || printer.status || 'offline';
    let html = `<div class="card"><h2>${esc(printer.name)}</h2><div class="muted">${esc(printer.model)}</div>`;
    html += `<span class="status ${esc(status)}">${esc(STATUS[status] || status)}</span>`;
    if (printer.detailError) {
      html += `<div class="muted" style="margin-top:10px">Sem detalhes agora: ${esc(printer.detailError)}</div></div>`;
      return html;
    }
    html += '<div class="row">' +
      `<div class="metric"><span class="muted">Bico</span><b>${temp(d.nozzleTemp, d.nozzleTargetTemp)}</b></div>` +
      `<div class="metric"><span class="muted">Mesa</span><b>${temp(d.bedTemp, d.bedTargetTemp)}</b></div>` +
      (d.chamberTemp ? `<div class="metric"><span class="muted">Câmara</span><b>${temp(d.chamberTemp)}</b></div>` : '') +
      `<div class="metric"><span class="muted">Luz</span><b>${d.lightStatus === 'open' ? 'Acesa' : d.lightStatus === 'close' ? 'Apagada' : '–'}</b></div>` +
      '</div>';
    if (d.printFileName && ['printing', 'pausing', 'pause', 'heating', 'busy'].includes(status)) {
      const pct = Math.round((d.printProgress || 0) * 100);
      const left = d.estimatedTime ? ` · faltam ${duration(d.estimatedTime)}` : '';
      html += `<div style="margin-top:12px"><span class="muted">${esc(d.printFileName)}</span>` +
        `<div class="progress"><div style="width:${pct}%"></div></div>` +
        `<span class="muted">${pct}% · camada ${d.printLayer || 0}/${d.targetPrintLayer || 0}${left}</span></div>`;
    }
    const slots = (d.matlStation && d.matlStation.slots) || [];
    if (slots.length) {
      html += '<div class="slots">' + slots.map((s) =>
        `<div class="slot"><div class="swatch ${s.hasFilament ? '' : 'emptyslot'}" style="background-color:${s.hasFilament ? color(s.color) : ''}"></div>` +
        `${esc(s.slotId)}: ${s.hasFilament ? esc(s.material || '?') : 'vazia'}</div>`).join('') + '</div>';
    }
    html += `<div class="footer"><span class="muted">Câmera, luz e envio de arquivos: em breve</span></div></div>`;
    return html;
  }

  window.artin3dFlashforge = {
    receive(message) {
      if (message.type === 'account') {
        account = message.data;
        renderAccount();
      } else if (message.type === 'loading') {
        $('refresh').disabled = true;
      } else if (message.type === 'printers') {
        $('refresh').disabled = false;
        if (!account.loggedIn) return;
        const { printers, error } = message.data;
        let html = error ? `<div class="error-box">Não foi possível atualizar: ${esc(error)}</div>` : '';
        html += printers.length ? printers.map(card).join('')
          : (error ? '' : '<div class="empty muted">Nenhuma impressora vinculada a esta conta.</div>');
        $('printers').innerHTML = html;
      }
    }
  };

  $('login').onclick = () => post('login');
  $('logout').onclick = () => post('logout');
  $('refresh').onclick = () => post('refresh');
  post('ready');
})();
</script>
</body>
</html>
